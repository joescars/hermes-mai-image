name: azure-mai-image
version: 0.3.0
description: "Microsoft Foundry MAI image generation and editing provider for Hermes Agent."
author: joescars
requires_hermes: ">=0.21.6"
license: MIT
python_dependencies:
  - "requests>=2.28,<3"
homepage: https://github.com/joescars/hermes-mai-image
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
requires_env:
  - MAI_FOUNDRY_ENDPOINT
optional_env:
  - MAI_FOUNDRY_API_KEY
  - MAI_FOUNDRY_AUTH
  - MAI_IMAGE_MODEL
  - MAI_FOUNDRY_MODELS_PATH
  - MAI_IMAGE_SIZE_PROFILE
  - MAI_REQUEST_DEADLINE
  - MAI_AUTO_ASPECT_RATIO
  - MAI_WEB_GROUNDING
config_schema:
  MAI_FOUNDRY_API_KEY:
    type: secret
    required: false
  MAI_FOUNDRY_ENDPOINT:
    type: string
    required: true
  MAI_FOUNDRY_AUTH:
    type: string
    required: false
  MAI_IMAGE_MODEL:
    type: string
    required: false
  MAI_FOUNDRY_MODELS_PATH:
    type: string
    required: false
  MAI_IMAGE_SIZE_PROFILE:
    type: string
    required: false
  MAI_REQUEST_DEADLINE:
    type: string
    required: false
  MAI_AUTO_ASPECT_RATIO:
    type: string
    required: false
  MAI_WEB_GROUNDING:
    type: string
    required: false
